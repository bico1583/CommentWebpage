<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Comments</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main class="page">
      <header class="page-header">
        <h1>Comments</h1>

        <div id="auth-section">
          <!-- Login / registration UI will be rendered here -->
        </div>
      </header>

      <section id="comment-form-section" class="comment-form-section">
        <!-- Comment form will be rendered here for logged-in users -->
      </section>

      <section id="comments-section" class="comments-section">
        <h2>Comments</h2>

        <div id="comments-container">
          <!-- Comments will be rendered here -->
        </div>
      </section>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/comments.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
